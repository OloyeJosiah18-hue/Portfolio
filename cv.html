<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiculum Vitae Download page</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Box Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
    /* Main Container */
        .container {
            position: fixed;
            left: 50%;
            top: 15%;
            transform: translateX(-50%);
            width: 30%;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(10, 10, 10, 0.6);
        }

        /* Image Wrapper */
        .img {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }

        .img img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .img img:hover {
            transform: scale(1.05);
        }

        .img img:active {
            transform: scale(0.95);
        }

        /* Download Button */
        .download {
            display: none;
            position: absolute;
            left: 50%;
            top: 85%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .img:hover .download {
            display: block;
        }

        .download:hover {
            background-color: #0056b3;
            transform: translateX(-50%) scale(1.08);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ByJosiah.</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <div class="container">
        <div class="img">
            <img src="img/CV.jpg" alt="CV Preview">
            <a href="CV.jpg" class="download" download>
                ⬇️ Click Here To Download
            </a>
        </div>
    </div>

</body>
</html>
